name: Deploy To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          command_timeout: 45m
          script: |
            REPO_DIR="${{ secrets.HOSTINGER_REPO_DIR }}"
            if [ ! -d "$REPO_DIR/.git" ] && [ -d "$REPO_DIR/.builds/source/repository/.git" ]; then
              REPO_DIR="$REPO_DIR/.builds/source/repository"
            fi
            if [ ! -d "$REPO_DIR/.git" ] && [ -d "$(dirname "$REPO_DIR")/nodejs/.git" ]; then
              REPO_DIR="$(dirname "$REPO_DIR")/nodejs"
            fi
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "HOSTINGER_REPO_DIR is not a git repository: $REPO_DIR" >&2
              exit 1
            fi
            export PUBLIC_HTML_DIR="${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}"
            export SERVER_RESTART_COMMAND="${{ secrets.HOSTINGER_SERVER_RESTART_COMMAND }}"
            export HOSTINGER_DEPLOY_SETTLE_SECONDS="${{ secrets.HOSTINGER_DEPLOY_SETTLE_SECONDS }}"
            export VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}"
            export VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            export VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}"
            export VITE_LANDING_ORIGIN="${{ secrets.VITE_LANDING_ORIGIN }}"
            export VITE_APP_ORIGIN="${{ secrets.VITE_APP_ORIGIN }}"
            export SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
            export SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
            export CANONICAL_ORIGIN="${{ secrets.CANONICAL_ORIGIN }}"
            export APP_ORIGIN="${{ secrets.APP_ORIGIN }}"
            cd "$REPO_DIR"
            if [ -n "$HOSTINGER_DEPLOY_SETTLE_SECONDS" ]; then
              echo "Waiting $HOSTINGER_DEPLOY_SETTLE_SECONDS seconds for Hostinger repo sync..."
              sleep "$HOSTINGER_DEPLOY_SETTLE_SECONDS"
            fi
            export SKIP_GIT_PULL=1
            bash scripts/deploy-hostinger.sh
