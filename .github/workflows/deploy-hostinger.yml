name: Deploy To Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_LANDING_ORIGIN: ${{ secrets.VITE_LANDING_ORIGIN }}
      VITE_APP_ORIGIN: ${{ secrets.VITE_APP_ORIGIN }}
      VITE_PADDLE_CLIENT_TOKEN: ${{ secrets.VITE_PADDLE_CLIENT_TOKEN }}
      VITE_PADDLE_ENV: ${{ secrets.VITE_PADDLE_ENV }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium runtime
        run: npm run install:playwright:chromium

      - name: Validate required frontend env
        run: |
          for var in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            VITE_API_BASE_URL \
            VITE_LANDING_ORIGIN \
            VITE_APP_ORIGIN \
            VITE_PADDLE_CLIENT_TOKEN \
            VITE_PADDLE_ENV
          do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var" >&2
              exit 1
            fi
          done

      - name: Write production env overrides
        run: |
          cat > client/.env.production.local <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          VITE_LANDING_ORIGIN=${VITE_LANDING_ORIGIN}
          VITE_APP_ORIGIN=${VITE_APP_ORIGIN}
          VITE_PADDLE_CLIENT_TOKEN=${VITE_PADDLE_CLIENT_TOKEN}
          VITE_PADDLE_ENV=${VITE_PADDLE_ENV}
          EOF

          cat > admin/.env.production.local <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          EOF

          cat > research/.env.production.local <<EOF
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          VITE_API_BASE_URL=${VITE_API_BASE_URL}
          EOF

      - name: Build static apps
        run: |
          rm -rf server/public/client server/public/admin server/public/research
          npm run build --workspace=client
          npm run build --workspace=admin
          npm run build --workspace=research

      - name: Archive client, admin, and research bundles
        run: |
          tar -czf client-build.tar.gz -C server/public/client .
          tar -czf admin-build.tar.gz -C server/public/admin .
          tar -czf research-build.tar.gz -C server/public/research .

      - name: Upload build archives to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "client-build.tar.gz,admin-build.tar.gz,research-build.tar.gz"
          target: "/tmp/iterojm-deploy"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          command_timeout: 45m
          script: |
            set -e

            PUBLIC_HTML_DIR="${{ secrets.HOSTINGER_PUBLIC_HTML_DIR }}"
            SERVER_RESTART_COMMAND="${{ secrets.HOSTINGER_SERVER_RESTART_COMMAND }}"
            HOSTINGER_DEPLOY_SETTLE_SECONDS="${{ secrets.HOSTINGER_DEPLOY_SETTLE_SECONDS }}"
            DEPLOY_TMP_DIR="/tmp/iterojm-deploy"
            APP_DIR="${PUBLIC_HTML_DIR}/app"
            ADMIN_DIR="${PUBLIC_HTML_DIR}/admin"
            RESEARCH_DIR="${PUBLIC_HTML_DIR}/research"

            if [ -z "$PUBLIC_HTML_DIR" ]; then
              echo "HOSTINGER_PUBLIC_HTML_DIR is required" >&2
              exit 1
            fi

            mkdir -p "$APP_DIR" "$ADMIN_DIR" "$RESEARCH_DIR"

            rm -rf "$APP_DIR"/*
            find "$APP_DIR" -mindepth 1 -maxdepth 1 -name '.*' -exec rm -rf {} +
            tar -xzf "$DEPLOY_TMP_DIR/client-build.tar.gz" -C "$APP_DIR"

            rm -rf "$ADMIN_DIR"/*
            find "$ADMIN_DIR" -mindepth 1 -maxdepth 1 -name '.*' -exec rm -rf {} +
            tar -xzf "$DEPLOY_TMP_DIR/admin-build.tar.gz" -C "$ADMIN_DIR"

            rm -rf "$RESEARCH_DIR"/*
            find "$RESEARCH_DIR" -mindepth 1 -maxdepth 1 -name '.*' -exec rm -rf {} +
            tar -xzf "$DEPLOY_TMP_DIR/research-build.tar.gz" -C "$RESEARCH_DIR"

            rm -f "$DEPLOY_TMP_DIR/client-build.tar.gz" "$DEPLOY_TMP_DIR/admin-build.tar.gz" "$DEPLOY_TMP_DIR/research-build.tar.gz"

            if [ -n "$HOSTINGER_DEPLOY_SETTLE_SECONDS" ]; then
              echo "Waiting $HOSTINGER_DEPLOY_SETTLE_SECONDS seconds before optional restart..."
              sleep "$HOSTINGER_DEPLOY_SETTLE_SECONDS"
            fi

            if [ -n "$SERVER_RESTART_COMMAND" ]; then
              bash -lc "$SERVER_RESTART_COMMAND"
            fi
