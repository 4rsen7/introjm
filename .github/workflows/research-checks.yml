name: Research local checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - 'admin/**'
      - 'scripts/test-research-postgres.cjs'
      - 'client/src/components/interviews/**'
      - 'client/src/pages/InterviewRoom.jsx'
      - 'server/**'
      - 'package*.json'
      - 'playwright.research.config.js'
      - '.github/workflows/research-checks.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: research-test-only
          POSTGRES_DB: research_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
      RESEARCH_TEST_DATABASE_URL: postgresql://postgres:research-test-only@127.0.0.1:5432/research_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:server
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: node scripts/test-research-postgres.cjs
      - run: npm run test:research-ui
      - run: npm run build:research
      - run: npm exec --workspace=admin vite build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: research-test-results
          path: test-results
